apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipelinerun-pvc
spec:
  # No storageClassName set on purpose: this lets the cluster use its default
  # StorageClass. Set one explicitly (e.g. "standard") if your cluster requires it.
  resources:
    requests:
      storage:  1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
